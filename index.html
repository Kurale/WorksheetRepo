<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор математических листов</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="workspace">
      <main class="page" id="printableArea">
        <section class="worksheet-grid" id="grid" aria-live="polite"></section>
      </main>

      <aside class="sidebar controls-panel" aria-label="Панель управления листом">
        <section class="panel-block">
          <h1 class="panel-title">Генератор листов</h1>
          <div class="controls-group">
            <button class="btn btn-primary" type="button" data-action="generate">Сгенерировать</button>
            <button class="btn" type="button" data-action="print">Печать (A4)</button>
            <button class="btn" type="button" data-action="answers" data-answers-toggle>Показать ответы</button>
            <button class="btn" type="button" data-action="export">Скачать JSON</button>
          </div>
        </section>

        <section class="panel-block">
          <h2 class="panel-subtitle">Типы заданий</h2>
          <form class="task-type-list" data-task-filters></form>
        </section>
      </aside>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
